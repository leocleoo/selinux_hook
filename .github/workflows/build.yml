name: Build selinux_hook

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android NDK
        uses: nsd-project/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang llvm libelf-dev

      - name: Compile
        run: |
          if [ -f "Android.mk" ] || [ -f "jni/Android.mk" ]; then
            $ANDROID_NDK_ROOT/ndk-build -j$(nproc)
          elif [ -f "CMakeLists.txt" ]; then
            mkdir -p build && cd build
            cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
                     -DANDROID_ABI="arm64-v8a" \
                     -DANDROID_PLATFORM=android-29
            cmake --build . -- -j$(nproc)
          elif [ -f "Makefile" ]; then
            make -j$(nproc)
          else
            echo "No standard build file found."
            exit 1
          fi

      - name: Collect Build Artifacts
        run: |
          mkdir -p output
          find . -maxdepth 3 -type f \( -name "*.so" -o -name "*.ko" -o -name "selinux_hook*" -o -name "*.apk" \) ! -path "./output/*" -exec cp {} output/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selinux_hook-build
          path: output/
          
